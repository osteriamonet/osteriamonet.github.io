<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Menù</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
padding:15px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.categoria{
margin-top:30px;
}

.categoria h2{
border-bottom:2px solid #ddd;
padding-bottom:5px;
}

.piatto{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.nome{
font-weight:bold;
font-size:18px;
}

.prezzo{
float:right;
font-weight:bold;
}

.descrizione{
font-size:14px;
color:#666;
margin-top:5px;
}

</style>

</head>

<body>

<h1>Menù</h1>

<div id="menu"></div>

<script>

async function caricaMenu(){

let response = await fetch("menuData.json")

let data = await response.json()

let container = document.getElementById("menu")

for(let categoria in data){

let blocco=document.createElement("div")
blocco.className="categoria"

let titolo=document.createElement("h2")
titolo.textContent=categoria

blocco.appendChild(titolo)

data[categoria].forEach(piatto=>{

let div=document.createElement("div")
div.className="piatto"

div.innerHTML=`

<div class="nome">
${piatto.nome}
<span class="prezzo">€${piatto.prezzo}</span>
</div>

<div class="descrizione">
${piatto.descrizione || ""}
</div>

`

blocco.appendChild(div)

})

container.appendChild(blocco)

}

}

caricaMenu()

</script>

</body>
</html>
