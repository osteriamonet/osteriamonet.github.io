<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osteria Monët - Menù</title>
<style>
/* stili come prima */
body { font-family:'Montserrat',sans-serif; margin:0; background:#faf8f5; color:#1a1a1a; }
.container { max-width:900px; margin:40px auto; padding:30px; background:rgba(255,255,255,0.97); border:3px solid #c9a24d; border-radius:15px; }
.accordion-btn{width:100%;padding:15px;font-size:22px;margin-top:18px;border:2px solid #c9a24d;border-radius:10px;cursor:pointer;text-align:left;background:#fff;}
.sub-btn{width:100%;padding:12px;margin-top:10px;font-size:18px;border-left:5px solid #c9a24d;border-radius:6px;cursor:pointer;background:#fdfdfd;text-align:left;}
.content{display:none;overflow:hidden;padding:0 5px;}
.menu-item{display:flex;justify-content:space-between;align-items:flex-start;margin:10px 0;font-size:15px;border-bottom:1px dotted #c9a24d60;padding-bottom:5px;}
.item-desc{font-size:14px;color:#555;font-style:italic;}
.price{font-weight:bold;color:#2f5d50;white-space:nowrap;margin-left:10px;}
</style>
</head>
<body>
<div class="container">
<h1>Osteria Monët</h1>
<div id="menu"></div>
</div>

<script>
const defaultMenu = {
  mare:{antipasti:[],primi:[],secondi:[],dolci:[]},
  terra:{antipasti:[],primi:[],secondi:[],dolci:[]},
  vini:{bianchi:[],rossi:[],bollicine:[],dolci:[]},
  cocktail:{classici:[],signature:[],distillati:[]}
};

let menuData = defaultMenu;
const GITHUB_RAW_URL = "https://raw.githubusercontent.com/osteriamonet/osteriamonet.github.io/main/menu/menuData.json";
const menuContainer = document.getElementById("menu");

async function loadMenu(){
  try{
    const resp = await fetch(GITHUB_RAW_URL);
    if(!resp.ok) throw new Error("Impossibile caricare JSON");
    menuData = await resp.json();
    createMenu();
  }catch(e){ console.error(e); alert("Errore caricamento menu, userò menu default"); createMenu(); }
}

function createMenu(){
  menuContainer.innerHTML="";
  for(let cat in menuData){
    const btn=document.createElement("button"); btn.className="accordion-btn"; btn.innerText=cat;
    const content=document.createElement("div"); content.className="content";
    for(let sec in menuData[cat]){
      const subBtn=document.createElement("button"); subBtn.className="sub-btn"; subBtn.innerText=sec;
      const subContent=document.createElement("div"); subContent.className="content";
      const items=menuData[cat][sec];
      if(items.length===0){ const p=document.createElement("p"); p.innerText="Nessun elemento inserito"; subContent.appendChild(p); }
      else items.forEach(item=>{
        const div=document.createElement("div"); div.className="menu-item";
        div.innerHTML=`<div><span class="item-name">${item.nome}</span>${item.descrizione?`<span class="item-desc">${item.descrizione}</span>`:""}</div><span class="price">${item.prezzo?"€"+item.prezzo:""}</span>`;
        subContent.appendChild(div);
      });
      subBtn.onclick=()=>{ subContent.style.display=subContent.style.display==="block"?"none":"block"; };
      content.appendChild(subBtn); content.appendChild(subContent);
    }
    btn.onclick=()=>{ content.style.display=content.style.display==="block"?"none":"block"; };
    menuContainer.appendChild(btn); menuContainer.appendChild(content);
  }
}

loadMenu();
</script>
</body>
</html>
