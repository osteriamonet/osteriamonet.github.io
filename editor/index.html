<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osteria Monët - Editor Completo</title>
<style>
/* Stessi stili di prima, li puoi mantenere */
body { font-family: 'Montserrat', sans-serif; background: #faf8f5; padding: 20px; color: #2f5d50; }
.container { max-width: 950px; margin:auto; background:white; padding:20px; border:2px solid #c9a24d; border-radius:10px; box-shadow:0 3px 15px rgba(0,0,0,0.08); }
h1,h2 { text-align:center; color:#c9a24d; }
button,input,textarea,select { font-family:inherit; font-size:14px; padding:4px 8px; margin:2px; border-radius:6px; border:1px solid #ccc; cursor:pointer; }
button:hover { background:#c9a24d; color:#2f5d50; }
ul { list-style:none; padding-left:10px; }
li { margin:4px 0; }
</style>
</head>
<body>

<div class="container">
<h1>Editor Completo - Osteria Monët</h1>

<section>
  <h2>Gestione Categorie</h2>
  <input id="newCategory" placeholder="Nuova categoria...">
  <button onclick="aggiungiCategoria()">➕ Aggiungi Categoria</button>
  <ul id="categoryList"></ul>
</section>

<section>
  <h2>Gestione Sottosezioni</h2>
  <select id="selectCategory"></select>
  <input id="newSection" placeholder="Nuova sottosezione...">
  <button onclick="aggiungiSezione()">➕ Aggiungi Sottosezione</button>
  <ul id="sectionList"></ul>
</section>

<section>
  <h2>Gestione Piatti</h2>
  <select id="selectCatForItem"></select>
  <select id="selectSecForItem"></select>
  <input id="itemName" placeholder="Nome piatto">
  <input id="itemPrice" placeholder="Prezzo (€)">
  <textarea id="itemDesc" placeholder="Descrizione"></textarea>
  <button onclick="aggiungiPiatto()">➕ Aggiungi / Aggiorna Piatto</button>
  <ul id="itemList"></ul>
</section>

<hr>

<section>
  <h2>Backup / Reset</h2>
  <button onclick="resetMenu()">⚠️ Reset Completo</button>
</section>
</div>

<script>
const defaultMenu = {
  mare:{antipasti:[],primi:[],secondi:[],dolci:[]},
  terra:{antipasti:[],primi:[],secondi:[],dolci:[]},
  vini:{bianchi:[],rossi:[],bollicine:[],dolci:[]},
  cocktail:{classici:[],signature:[],distillati:[]}
};

// CONFIG GITHUB
const GITHUB_USERNAME = "osteriamonet"; // tuo username
const REPO_NAME = "osteriamonet.github.io";
const BRANCH = "main";
const FILE_PATH = "menu/menuData.json";
const GITHUB_TOKEN = "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";

let menuData = JSON.parse(localStorage.getItem("menuData")) || defaultMenu;

// --- UTILITY GITHUB ---
async function salvaMenu() {
  const content = JSON.stringify(menuData, null, 2);

  try {
    const shaResp = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
      headers: { Authorization: `token ${GITHUB_TOKEN}` }
    });
    const shaData = await shaResp.json();
    const sha = shaData.sha;

    const resp = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
      method:"PUT",
      headers: { Authorization: `token ${GITHUB_TOKEN}`, "Content-Type":"application/json" },
      body: JSON.stringify({ message:"Aggiornamento menu", content:btoa(unescape(encodeURIComponent(content))), sha:sha })
    });
    const data = await resp.json();
    if(data.content) alert("Menu salvato correttamente su GitHub!");
    else alert("Errore nel salvataggio: " + JSON.stringify(data));
  } catch(e){ console.error(e); alert("Errore nel salvataggio: " + e); }
  mostraTutto();
}

// --- FUNZIONI EDITOR (categorie, sezioni, piatti) ---
function aggiornaCategorie() {
  const catSelect1 = document.getElementById("selectCategory");
  const catSelect2 = document.getElementById("selectCatForItem");
  const list = document.getElementById("categoryList");
  catSelect1.innerHTML = ""; catSelect2.innerHTML = ""; list.innerHTML = "";
  for(let cat in menuData){
    const li = document.createElement("li");
    li.innerHTML = `${cat} <button onclick="rinominaCategoria('${cat}')">✏️</button> <button onclick="rimuoviCategoria('${cat}')">❌</button>`;
    list.appendChild(li);
    [catSelect1, catSelect2].forEach(sel=>{
      const opt = document.createElement("option"); opt.value=cat; opt.innerText=cat; sel.appendChild(opt);
    });
  }
  aggiornaSezioni();
  aggiornaPiatti();
}

function aggiungiCategoria() {
  const val = document.getElementById("newCategory").value.trim().toLowerCase();
  if(!val) return alert("Inserisci un nome categoria");
  if(menuData[val]) return alert("Categoria già esistente");
  menuData[val] = {};
  document.getElementById("newCategory").value="";
  salvaMenu();
}

function rinominaCategoria(cat) { const nuovo = prompt("Nuovo nome categoria:",cat); if(!nuovo||nuovo.trim()==="") return; if(menuData[nuovo]) return alert("Nome già esistente"); menuData[nuovo]=menuData[cat]; delete menuData[cat]; salvaMenu(); }
function rimuoviCategoria(cat){ if(confirm("Eliminare categoria e tutto il suo contenuto?")){ delete menuData[cat]; salvaMenu(); } }
function aggiornaSezioni(){ const cat=document.getElementById("selectCategory").value; const list=document.getElementById("sectionList"); const secSelect=document.getElementById("selectSecForItem"); list.innerHTML=""; secSelect.innerHTML=""; if(!cat||!menuData[cat]) return; for(let sec in menuData[cat]){ const li=document.createElement("li"); li.innerHTML=`${sec} <button onclick="rinominaSezione('${cat}','${sec}')">✏️</button> <button onclick="rimuoviSezione('${cat}','${sec}')">❌</button>`; list.appendChild(li); const opt=document.createElement("option"); opt.value=sec; opt.innerText=sec; secSelect.appendChild(opt); } aggiornaPiatti(); }
function aggiungiSezione(){ const cat=document.getElementById("selectCategory").value; const sec=document.getElementById("newSection").value.trim().toLowerCase(); if(!cat) return alert("Seleziona categoria"); if(!sec) return alert("Inserisci nome sottosezione"); if(menuData[cat][sec]) return alert("Sottosezione già esistente"); menuData[cat][sec]=[]; document.getElementById("newSection").value=""; salvaMenu(); }
function rinominaSezione(cat,sec){ const nuovo=prompt("Nuovo nome sottosezione:",sec); if(!nuovo||nuovo.trim()==="") return; if(menuData[cat][nuovo]) return alert("Nome già esistente"); menuData[cat][nuovo]=menuData[cat][sec]; delete menuData[cat][sec]; salvaMenu(); }
function rimuoviSezione(cat,sec){ if(confirm("Eliminare sottosezione e tutti i piatti?")){ delete menuData[cat][sec]; salvaMenu(); } }
function aggiornaPiatti(){ const cat=document.getElementById("selectCatForItem").value; const sec=document.getElementById("selectSecForItem").value; const list=document.getElementById("itemList"); list.innerHTML=""; if(!cat||!sec||!menuData[cat]||!menuData[cat][sec]) return; menuData[cat][sec].forEach((item,idx)=>{ const li=document.createElement("li"); li.innerHTML=`<b>${item.nome}</b> - €${item.prezzo||""} <i>${item.descrizione||""}</i> <button onclick="modificaPiatto('${cat}','${sec}',${idx})">✏️</button> <button onclick="rimuoviPiatto('${cat}','${sec}',${idx})">❌</button>`; list.appendChild(li); }); }
function aggiungiPiatto(){ const cat=document.getElementById("selectCatForItem").value; const sec=document.getElementById("selectSecForItem").value; const nome=document.getElementById("itemName").value.trim(); const prezzo=document.getElementById("itemPrice").value.trim(); const desc=document.getElementById("itemDesc").value.trim(); if(!cat||!sec) return alert("Seleziona categoria e sottosezione"); if(!nome) return alert("Nome piatto obbligatorio"); menuData[cat][sec].push({nome,prezzo,descrizione:desc}); document.getElementById("itemName").value=""; document.getElementById("itemPrice").value=""; document.getElementById("itemDesc").value=""; salvaMenu(); }
function modificaPiatto(cat,sec,idx){ const item=menuData[cat][sec][idx]; const nome=prompt("Nome piatto:",item.nome); if(!nome) return; const prezzo=prompt("Prezzo (€):",item.prezzo||""); const desc=prompt("Descrizione:",item.descrizione||""); menuData[cat][sec][idx]={nome,prezzo,descrizione:desc}; salvaMenu(); }
function rimuoviPiatto(cat,sec,idx){ if(confirm("Eliminare piatto?")){ menuData[cat][sec].splice(idx,1); salvaMenu(); } }

function resetMenu(){ if(confirm("Cancellare tutto il menù?")){ menuData=defaultMenu; salvaMenu(); } }

function mostraTutto(){ aggiornaCategorie(); }

document.getElementById("selectCategory").addEventListener("change", aggiornaSezioni);
document.getElementById("selectCatForItem").addEventListener("change", aggiornaSezioni);
document.getElementById("selectSecForItem").addEventListener("change", aggiornaPiatti);

mostraTutto();
</script>
</body>
</html>
